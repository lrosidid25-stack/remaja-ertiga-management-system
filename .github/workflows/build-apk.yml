name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'apps/tawuran/**'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Gradle assembleDebug + publish APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/tawuran

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/tawuran/package-lock.json

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Android SDK sudah tersedia di runner ubuntu-latest.
      # Pastikan platform 36 + build-tools ada, lalu tunjuk lokasi SDK ke Gradle.
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK" > android/local.properties
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes 2>/dev/null | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" \
              || echo "sdkmanager install dilewati (kemungkinan sudah terpasang)"
          else
            echo "sdkmanager tidak ditemukan — mengandalkan auto-download AGP"
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web bundle
        run: npm run build
        env:
          APP_BUILD: ${{ github.run_number }}

      - name: Sync web bundle into Android project
        run: npx cap sync android

      - name: Build signed APK (release)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
             out/tawuran-jalanan-sore.apk
          ls -lh out/

      - name: Verify APK (paket, versi, tanda tangan)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT=$(ls -d "$SDK"/build-tools/*/ 2>/dev/null | tail -1)
          echo "== badging =="
          "$BT/aapt" dump badging out/tawuran-jalanan-sore.apk \
            | grep -E "package:|sdkVersion|targetSdkVersion|application-label|native-code" || true
          echo "== apksigner =="
          "$BT/apksigner" verify --print-certs out/tawuran-jalanan-sore.apk
          "$BT/apksigner" verify --verbose out/tawuran-jalanan-sore.apk | head -20

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tawuran-jalanan-sore-apk
          path: apps/tawuran/out/tawuran-jalanan-sore.apk
          if-no-files-found: error

      # Publikasi ke GitHub Releases → link unduhan langsung (tanpa login)
      # yang bisa dibuka dari browser HP.
      - name: Publish APK to release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-terbaru
          name: Tawuran Jalanan Sore — APK
          body: |
            APK siap dipasang (sideload) di Android.

            Cara pasang: buka file APK di HP → izinkan "Instal aplikasi tak dikenal"
            untuk browser/file manager → Instal.

            APK ditandatangani dengan kunci tetap, jadi versi baru bisa dipasang
            menimpa versi lama tanpa uninstall.

            Build #${{ github.run_number }} dari commit ${{ github.sha }}.
          files: apps/tawuran/out/tawuran-jalanan-sore.apk
          fail_on_unmatched_files: true
          make_latest: true
