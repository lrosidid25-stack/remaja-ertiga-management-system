name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'apps/tawuran/**'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Gradle assembleDebug + publish APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/tawuran

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/tawuran/package-lock.json

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web bundle
        run: npm run build
        env:
          APP_BUILD: ${{ github.run_number }}

      - name: Sync web bundle into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             out/tawuran-jalanan-sore.apk
          ls -lh out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tawuran-jalanan-sore-apk
          path: apps/tawuran/out/tawuran-jalanan-sore.apk
          if-no-files-found: error

      # Publikasi ke GitHub Releases → link unduhan langsung (tanpa login)
      # yang bisa dibuka dari browser HP.
      - name: Publish APK to release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-terbaru
          name: Tawuran Jalanan Sore — APK
          body: |
            APK siap dipasang (sideload) di Android.

            Cara pasang: buka file APK di HP → izinkan "Instal aplikasi tak dikenal"
            untuk browser/file manager → Instal.

            Build #${{ github.run_number }} dari commit ${{ github.sha }}.
          files: apps/tawuran/out/tawuran-jalanan-sore.apk
          fail_on_unmatched_files: true
          make_latest: true
